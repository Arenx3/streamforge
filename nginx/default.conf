# Docker's DNS: a recreated backend container comes back with a new IP.
resolver 127.0.0.11 valid=5s ipv6=off;
# A failed lookup is retried after this long; the 30 s default means a long 502.
resolver_timeout 2s;

upstream django_backend {
    zone django_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Videos go from the browser straight to S3; the API only receives small JSON.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/vnd.apple.mpegurl;

    location /api/ {
        proxy_pass http://django_backend;
    }

    location /admin/ {
        proxy_pass http://django_backend;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Frontend (React/Vite) is wired in a later phase.
    location / {
        default_type text/plain;
        return 200 "StreamForge gateway OK\n";
    }
}
