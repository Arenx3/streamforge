name: streamforge

# Working local defaults, then optional personal overrides: no setup needed to run.
x-env-files: &env-files
  - path: .env.example
  - path: .env
    required: false

x-backend-env: &backend-env
  env_file: *env-files
  environment:
    # Host browsers use for presigned URLs ("storage" only resolves inside Docker).
    AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${STORAGE_API_PORT:-9000}}
    # Local inbox the app links to.
    MAILBOX_URL: ${MAILBOX_URL-http://localhost:${MAILPIT_UI_PORT:-8025}}
    # Base of the links sent by email.
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${NGINX_PORT:-80}}
    # Used when DJANGO_SECRET_KEY is empty.
    DJANGO_SECRET_KEY_FILE: /run/streamforge/django_secret_key
  volumes:
    - app_secrets:/run/streamforge:ro
  restart: unless-stopped

services:
  # Creates a random Django secret on first boot and keeps it in a volume.
  secrets-init:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        key=/secrets/django_secret_key
        if [ ! -s "$$key" ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > "$$key.tmp"
          mv "$$key.tmp" "$$key"
        fi
        chmod 0444 "$$key"
    volumes:
      - app_secrets:/secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamforge}
      POSTGRES_USER: ${POSTGRES_USER:-streamforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible server (RustFS). Production uses Cloudflare R2.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-streamforge}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-local-dev-only}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - storage_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STORAGE_CONSOLE_PORT:-9001}:9001"
      - "127.0.0.1:${STORAGE_API_PORT:-9000}:9000"

  storage-init:
    image: amazon/aws-cli:2.39.5
    env_file: *env-files
    environment:
      # Where the app is served from, so browsers can upload and play directly.
      APP_ORIGINS: http://localhost:${NGINX_PORT:-80},http://127.0.0.1:${NGINX_PORT:-80}
    depends_on:
      - storage
    volumes:
      - ./storage/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    restart: "no"

  backend:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_files:/app/staticfiles
      - app_secrets:/run/streamforge:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend-env
    # Reaps FFmpeg processes orphaned when a pool process dies.
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=1
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  beat:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/streamforge/celerybeat-schedule
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  accounts-worker:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # Own queue: account emails must not wait behind hours-long transcodes.
    command: >
      celery -A config worker
      --loglevel=INFO
      --queues=accounts
      --concurrency=1
      --prefetch-multiplier=1
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      # Inbox UI on loopback only: messages contain account links.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Long-lived SSE connections, kept away from the API's request workers.
  events:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --worker-class gthread
      --workers 1
      --threads ${EVENTS_THREADS:-64}
      --timeout 60
      --graceful-timeout 5
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Gateway: serves the React build and proxies the API.
  nginx:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # The only variables the config template may read.
      NGINX_ENVSUBST_FILTER: "^(BEHIND_TLS_PROXY|NGINX_STORAGE_ORIGINS)$$"
      BEHIND_TLS_PROXY: ${BEHIND_TLS_PROXY:-false}
      # Where the browser loads video from: the bucket's public host.
      NGINX_STORAGE_ORIGINS: "${NGINX_STORAGE_ORIGINS:-http://localhost:* http://127.0.0.1:*}"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_files:/var/www/static:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      events:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_data:
  static_files:
  app_secrets:
