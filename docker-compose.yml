name: streamforge

x-backend-env: &backend-env
  env_file: .env
  environment:
    # Host browsers use for presigned URLs ("storage" only resolves inside Docker).
    AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${STORAGE_API_PORT:-9000}}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible server (RustFS). Production uses Cloudflare R2.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - storage_data:/data
    ports:
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
      - "127.0.0.1:${STORAGE_API_PORT:-9000}:9000"

  storage-init:
    image: amazon/aws-cli:2.39.5
    env_file: .env
    depends_on:
      - storage
    volumes:
      - ./storage/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    restart: "no"

  backend:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend-env
    # Reaps FFmpeg processes orphaned when a pool process dies.
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  beat:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/streamforge/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  accounts-worker:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # Own queue: account emails must not wait behind hours-long transcodes.
    command: >
      celery -A config worker
      --loglevel=INFO
      --queues=accounts
      --concurrency=1
      --prefetch-multiplier=1
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      # Inbox UI on loopback only: messages contain account links.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_data:
  static_files:
