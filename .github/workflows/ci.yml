name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format
        run: ruff format --check backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key-for-test-suite
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      AWS_STORAGE_BUCKET_NAME: streamforge-ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streamforge
          POSTGRES_USER: streamforge
          POSTGRES_PASSWORD: streamforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start stack from a clean checkout, without .env
        run: docker compose up -d --build
      - name: Wait for /api/health/
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health/; then echo; exit 0; fi
            sleep 3
          done
          echo "Stack did not become healthy in time" >&2
          exit 1
      - name: Gateway serves the app
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/ruta/del/cliente | grep -q '<div id="root">'
          curl -fsS http://localhost/api/health/ | jq -e '.status == "ok"'
      - name: Worker runs a task with FFmpeg
        run: |
          docker compose exec -T backend python manage.py shell -c "
          from core.tasks import ping
          result = ping.delay().get(timeout=60)
          print(result)
          assert result['ffmpeg'], 'FFmpeg not available in worker'
          "
      - name: Demo account holds a processed sample
        run: |
          DEMO="$(curl -fsS -X POST http://localhost/api/auth/demo/ | jq -r .access)"
          for i in $(seq 1 120); do
            STATE="$(curl -fsS http://localhost/api/videos/ -H "Authorization: Bearer $DEMO" \
              | jq -r '.results[0].status // empty')"
            if [ "$STATE" = "READY" ]; then break; fi
            sleep 2
          done
          test "$STATE" = "READY"
      - name: Auth, upload and transcode flow
        run: |
          API=http://localhost/api/auth
          CREDENTIALS="$(jq -n --arg password "$(openssl rand -hex 16)" \
            '{email: "smoke@example.com", password: $password}')"
          curl -fsS -X POST "$API/register/" -H 'Content-Type: application/json' -d "$CREDENTIALS"
          ACCESS="$(curl -fsS -X POST "$API/token/" -H 'Content-Type: application/json' \
            -d "$CREDENTIALS" | jq -r .access)"
          curl -fsS "$API/me/" -H "Authorization: Bearer $ACCESS" \
            | jq -e '.email == "smoke@example.com" and .email_verified == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/videos/ \
            -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d '{"title": "Blocked", "content_type": "video/mp4", "size_bytes": 1024}')" = "403"
          for i in $(seq 1 30); do
            MESSAGE="$(curl -fsS 'http://localhost:8025/api/v1/search?query=to:smoke@example.com&limit=1' \
              | jq -r '.messages[0].ID // empty')"
            if [ -n "$MESSAGE" ]; then break; fi
            sleep 1
          done
          EMAIL_TOKEN="$(curl -fsS "http://localhost:8025/api/v1/message/$MESSAGE" \
            | jq -r .Text | grep -o 'token=[^[:space:]]*' | head -1 | cut -d= -f2-)"
          curl -fsS -X POST "$API/email/verify/" -H "Authorization: Bearer $ACCESS" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg token "$EMAIL_TOKEN" '{token: $token}')" | jq -e '.email_verified == true'
          docker compose exec -T worker ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=854x480:rate=24:duration=4 \
            -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest \
            -movflags frag_keyframe+empty_moov -f mp4 pipe:1 > sample.mp4
          SIZE="$(stat -c%s sample.mp4)"
          UPLOAD="$(curl -fsS -X POST http://localhost/api/videos/ \
            -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d "$(jq -n --argjson size "$SIZE" '{title: "Smoke", content_type: "video/mp4", size_bytes: $size}')")"
          curl -fsS -X PUT --upload-file sample.mp4 "$(jq -r '.upload.parts[0].url' <<< "$UPLOAD")"
          VIDEO_ID="$(jq -r .video.id <<< "$UPLOAD")"
          curl -fsS -X POST "http://localhost/api/videos/$VIDEO_ID/complete/" \
            -H "Authorization: Bearer $ACCESS" | jq -e '.status == "UPLOADED"'
          docker compose exec -T backend python manage.py shell -c "
          import time
          from django.conf import settings
          from core.storage import s3_client
          from videos.models import Video
          video = Video.objects.get(pk='$VIDEO_ID')
          deadline = time.time() + 120
          while video.status not in ('READY', 'FAILED') and time.time() < deadline:
              time.sleep(2)
              video.refresh_from_db()
          assert video.status == 'READY', (video.status, video.error_message)
          master = s3_client().get_object(Bucket=settings.AWS_STORAGE_BUCKET_NAME, Key=video.hls_master_key)
          body = master['Body'].read().decode()
          print(body)
          assert '360p/index.m3u8' in body and '480p/index.m3u8' in body
          cover = s3_client().head_object(Bucket=settings.AWS_STORAGE_BUCKET_NAME, Key=video.thumbnail_key)
          assert cover['ContentType'] == 'image/webp' and cover['ContentLength'] > 0
          "
          curl -fsS "http://localhost/api/videos/$VIDEO_ID/status/" \
            -H "Authorization: Bearer $ACCESS" | jq -e '.status == "READY" and .progress == 100'
          head -c 2048 /dev/urandom > corrupt.mp4
          BAD="$(curl -fsS -X POST http://localhost/api/videos/ \
            -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d '{"title": "Corrupt", "content_type": "video/mp4", "size_bytes": 2048}')"
          curl -fsS -X PUT --upload-file corrupt.mp4 "$(jq -r '.upload.parts[0].url' <<< "$BAD")"
          BAD_ID="$(jq -r .video.id <<< "$BAD")"
          curl -fsS -X POST "http://localhost/api/videos/$BAD_ID/complete/" -H "Authorization: Bearer $ACCESS"
          for i in $(seq 1 30); do
            STATE="$(curl -fsS "http://localhost/api/videos/$BAD_ID/status/" \
              -H "Authorization: Bearer $ACCESS" | jq -r .status)"
            if [ "$STATE" = "FAILED" ]; then break; fi
            sleep 1
          done
          test "$STATE" = "FAILED"
          test "$(docker compose exec -T worker sh -c 'ls -A /tmp/streamforge | wc -l')" = "0"
          PLAYBACK="$(curl -fsS "http://localhost/api/videos/$VIDEO_ID/" \
            -H "Authorization: Bearer $ACCESS" | jq -r .playback_url)"
          curl -fsS "$PLAYBACK" | grep -q '360p/index.m3u8'
          SEGMENT="$(curl -fsS "${PLAYBACK%master.m3u8}360p/index.m3u8" | grep -m1 '^http')"
          curl -fsS -o /dev/null "$SEGMENT"
          curl -fsS -X DELETE "http://localhost/api/videos/$VIDEO_ID/" -H "Authorization: Bearer $ACCESS"
          docker compose exec -T backend python manage.py shell -c "
          import time
          from django.conf import settings
          from core.storage import s3_client
          for _ in range(30):
              found = s3_client().list_objects_v2(Bucket=settings.AWS_STORAGE_BUCKET_NAME, Prefix='videos/$VIDEO_ID/')
              if not found.get('KeyCount'):
                  break
              time.sleep(1)
          assert not found.get('KeyCount'), found
          "
      - name: Gateway survives a backend IP change
        run: |
          backend_ip() {
            docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
              "$(docker compose ps -q backend)"
          }
          OLD_IP="$(backend_ip)"
          docker compose rm -sf backend
          # Takes the freed address, so the new backend container must get another one.
          docker run -d --rm --name ip-holder --network streamforge_default redis:7-alpine sleep 120
          trap 'docker rm -f ip-holder' EXIT
          docker compose up -d --no-deps --wait backend
          test "$(backend_ip)" != "$OLD_IP"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost/api/health/; then echo; exit 0; fi
            sleep 1
          done
          echo "nginx did not reconnect to the recreated backend" >&2
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
