name: Bug
description: Reportar un error
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Comportamiento actual.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - backend
        - worker
        - frontend
        - infra
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Salida relevante de `docker compose logs <servicio>`.
      render: shell
