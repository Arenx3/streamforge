<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
  <div style="display:none;max-height:0;overflow:hidden;">{{ body }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <tr>
            <td style="padding:0 4px 16px;font-size:14px;font-weight:600;letter-spacing:-0.01em;color:#18181b;">StreamForge</td>
          </tr>
          <tr>
            <td style="padding:32px;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
              <h1 style="margin:0 0 12px;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.02em;color:#18181b;">{{ heading }}</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:24px;color:#52525b;">{{ body }}</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:8px;background-color:#18181b;">
                    <a href="{{ url }}" style="display:inline-block;padding:11px 18px;font-size:14px;line-height:20px;font-weight:500;color:#ffffff;text-decoration:none;border-radius:8px;">{{ action }}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #f4f4f5;font-size:13px;line-height:20px;color:#71717a;">{{ note }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 4px 0;font-size:12px;line-height:18px;color:#a1a1aa;word-break:break-all;">Si el botón no funciona, abre este enlace:<br>{{ url }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
